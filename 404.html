<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to FOCES Official Website</title>
  <meta http-equiv="refresh" content="0; url=https://foces.ceconline.edu/">
  <link rel="canonical" href="https://foces.ceconline.edu/">
  <script>
    window.location.replace("https://foces.ceconline.edu/");
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #0f172a;
      color: #f8fafc;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 2rem 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      border: 1px solid #334155;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: #38bdf8;
    }
    p {
      margin-bottom: 1.5rem;
      color: #94a3b8;
      line-height: 1.6;
    }
    a.btn {
      display: inline-block;
      background: #0284c7;
      color: #ffffff;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s ease;
    }
    a.btn:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>FOCES Website Moved</h1>
    <p>This page has moved to our new official website. You are being redirected automatically...</p>
    <a class="btn" href="https://foces.ceconline.edu/">Go to foces.ceconline.edu</a>
  </div>
</body>
</html>
